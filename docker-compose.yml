services:
  # Service 1 : Notre application PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation_app
    restart: unless-stopped
    ports:
      - "80:80:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - db

  # Service 2 : Base de données MySQL
  db:
    image: mysql:8.0
    container_name: reservation_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-reservation_salles}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
